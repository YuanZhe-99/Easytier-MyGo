name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Go version comes from go.mod, so a Go release never changes the
      # build underneath a working checkout.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Formatting
        run: |
          unformatted=$(gofmt -l cmd internal tools third_party)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go test ./...
      - run: go tool mygo vet .
      - name: Interface catalogs
        run: go tool mygo i18n check
      - name: Documentation mirror
        run: go run ./tools/checkdocs

      # Informational here; the weekly upstream workflow opens an issue.
      - name: Upstream pins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./tools/deps check

  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...
